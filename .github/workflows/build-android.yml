name: Build Android app

on:
  push:
    branches:
      - claude/ski-stations-database-rhvohj
    paths:
      - mobile-app/**
      - .github/workflows/build-android.yml
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: mobile-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Decode signing keystore
        env:
          SKIINFO_KEYSTORE_BASE64: ${{ secrets.SKIINFO_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$SKIINFO_KEYSTORE_BASE64" ]; then
            echo "$SKIINFO_KEYSTORE_BASE64" | base64 -d > release.keystore
            echo "SKIINFO_KEYSTORE_PATH=$(pwd)/release.keystore" >> "$GITHUB_ENV"
          else
            echo "No SKIINFO_KEYSTORE_BASE64 secret set -- building an unsigned AAB."
          fi

      - name: Build release AAB
        env:
          SKIINFO_KEYSTORE_PATH: ${{ env.SKIINFO_KEYSTORE_PATH }}
          SKIINFO_KEYSTORE_PASSWORD: ${{ secrets.SKIINFO_KEYSTORE_PASSWORD }}
          SKIINFO_KEY_ALIAS: ${{ secrets.SKIINFO_KEY_ALIAS }}
          SKIINFO_KEY_PASSWORD: ${{ secrets.SKIINFO_KEY_PASSWORD }}
        run: ./gradlew :app:bundleRelease :app:assembleRelease --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: ski-info-release
          path: |
            mobile-app/app/build/outputs/bundle/release/*.aab
            mobile-app/app/build/outputs/apk/release/*.apk
          retention-days: 14
