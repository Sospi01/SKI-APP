name: Data descriptive analysis

on:
  push:
    branches:
      - claude/ski-stations-database-rhvohj
    paths:
      - .github/workflows/data-analysis.yml
  workflow_dispatch: {}

jobs:
  build-and-analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: data-pipeline
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      - name: Download OpenSkiMap data and build the database
        run: python -m ski_pipeline.cli --db data/ski_info.db -v

      - name: List Spanish ski areas
        run: |
          python - <<'PY'
          import json
          import sqlite3

          conn = sqlite3.connect("data/ski_info.db")
          conn.row_factory = sqlite3.Row

          def q(sql, params=()):
              return [dict(r) for r in conn.execute(sql, params).fetchall()]

          rows = q(
              """
              SELECT sa.id, sa.name, sa.region, sa.status, sa.min_elevation_m, sa.max_elevation_m,
                     (SELECT COUNT(*) FROM run_ski_areas WHERE ski_area_id = sa.id) AS run_segments,
                     (SELECT COUNT(*) FROM lift_ski_areas WHERE ski_area_id = sa.id) AS lift_count,
                     (SELECT ROUND(SUM(length_km), 1) FROM ski_area_run_stats WHERE ski_area_id = sa.id) AS piste_km
              FROM ski_areas sa
              WHERE sa.country_code = 'ES' AND sa.activities LIKE '%downhill%'
              ORDER BY (piste_km IS NULL), piste_km DESC
              """
          )

          print("===ES_STATIONS_JSON_START===")
          print(json.dumps(rows))
          print("===ES_STATIONS_JSON_END===")
          print(f"TOTAL: {len(rows)}")
          operating_with_runs = [r for r in rows if r["status"] == "operating" and (r["run_segments"] or 0) > 0 and (r["lift_count"] or 0) > 0]
          print(f"OPERATING_WITH_RUNS_AND_LIFTS: {len(operating_with_runs)}")
          PY
