[project]
name = "ski-pipeline"
version = "0.1.0"
description = "Downloads OpenSkiMap data and builds a local SQLite database for the Ski Info app."
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
    "ijson>=3.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
ski-pipeline = "ski_pipeline.cli:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["ski_pipeline*"]
